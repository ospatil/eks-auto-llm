# Streamlit chat app. Runs on a default Auto Mode node (no GPU, no toleration -
# so it never lands on the expensive A10G). The image ref is templated by the
# deploy script from the ECR repo output; replace __STREAMLIT_IMAGE__ if applying
# by hand. Verified via `kubectl port-forward svc/streamlit 8501` through the tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: llm
  labels: { app: streamlit }
spec:
  replicas: 1
  selector:
    matchLabels: { app: streamlit }
  template:
    metadata:
      labels: { app: streamlit }
    spec:
      # No in-cluster api access needed - this app only talks to the vLLM API over HTTP
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: streamlit
          image: __STREAMLIT_IMAGE__
          # plain python web app: lock it down. Matches the non-root USER baked into the image (src/streamlit/Dockerfile).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8501 }
          env:
            - { name: VLLM_BASE_URL, value: "http://llm-api:8000/v1" }
            # Must match --served-model-name in k8s/vllm-deployment.yaml; this is
            # the value the app puts in the OpenAI `model` field on each request.
            - { name: MODEL_NAME, value: "chat" }
          resources:
            requests: { cpu: "250m", memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          # readOnlyRootFilesystem is set, so give the app writable scratch for paths needed at runtime
          # /tmp (media/upload storage) and the home dir (~/.streamlit). Everything else stays read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: llm
  labels: { app: streamlit }
spec:
  type: ClusterIP
  selector: { app: streamlit }
  ports:
    - { name: http, port: 8501, targetPort: 8501 }
